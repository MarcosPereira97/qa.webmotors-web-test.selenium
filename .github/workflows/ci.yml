name: CI - E2E Tests (Selenium/Ruby)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  cucumber-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@4

      - name: Setup Ruby
        uses: ruby/setup-ruby@1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@1

      - name: Run Cucumber tests
        run: bundle exec cucumber
